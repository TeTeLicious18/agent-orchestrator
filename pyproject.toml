[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import order
    "UP",   # pyupgrade
    "B",    # bugbear
    "S",    # bandit: this repository is a security boundary
    "ASYNC",
]
ignore = [
    "E501",     # line length is enforced by the formatter, not the linter
    "B008",     # FastAPI dependencies are called in defaults by design
    "UP042",    # enums are read through .value everywhere; StrEnum would change str()
    "ASYNC240", # os.path checks on a local workspace are cheap stat calls
    "ASYNC220", # desktop and editor launches are deliberately fire-and-forget
    "ASYNC109", # tools/demo.py is a CLI whose timeout is a user-facing option
    "S101",     # the remaining asserts narrow types after an explicit None check
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately probe rejected paths and assert on internals.
"tests/*" = ["S101", "S108", "SLF001"]
# Launching allow-listed programs without a shell is the whole point of these modules.
"agent_node/adapters/desktop.py" = ["S603", "S607"]
"agent_node/adapters/code_runner.py" = ["S603"]
"agent_node/adapters/builtin.py" = ["S603"]
"agent_node/adapters/autonomous.py" = ["S603", "S606"]
